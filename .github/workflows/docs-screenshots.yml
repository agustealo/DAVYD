name: Documentation Screenshots

on:
  push:
    branches: [docs/app-screenshots]
    paths:
      - scripts/capture_docs_screenshots.py
      - .github/workflows/docs-screenshots.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      QT_SCALE_FACTOR: "1"
      MPLBACKEND: QtAgg

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: docs/app-screenshots

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Install DAVYD
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip check

      - name: Render screenshots
        run: python scripts/capture_docs_screenshots.py

      - name: Verify captures
        run: |
          test -s docs/images/app-overview.png
          test -s docs/images/schema-workspace.png
          test -s docs/images/generation-live.png
          test -s docs/images/data-quality.png

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/*.png
          if git diff --cached --quiet; then
            echo "Screenshots are already current"
            exit 0
          fi
          git commit -m "docs: refresh DAVYD app screenshots"
          git push origin HEAD:docs/app-screenshots
