name: Data Quality Screenshot

on:
  push:
    branches: [ui/data-quality-redesign]
    paths:
      - src/ui/tabs/visualization_tab.py
      - scripts/capture_data_quality_redesign.py
      - .github/workflows/data-quality-screenshot.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      QT_SCALE_FACTOR: "1"
      MPLBACKEND: QtAgg

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ui/data-quality-redesign

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Install DAVYD
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip check

      - name: Render and verify redesigned workspace
        run: python scripts/capture_data_quality_redesign.py

      - name: Commit screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/data-quality.png
          if git diff --cached --quiet; then
            echo "Screenshot is already current"
            exit 0
          fi
          git commit -m "docs: refresh data quality screenshot"
          git push origin HEAD:ui/data-quality-redesign
