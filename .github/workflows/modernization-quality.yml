name: Modernization Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - modernize/**

permissions:
  contents: read

jobs:
  generation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install contract-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pandas==3.0.6" \
            "PySide6==6.11.2" \
            "httpx>=0.28,<1" \
            "pytest>=8.4,<9"

      - name: Compile modernization runtime
        env:
          PYTHONPATH: src
        run: |
          python -m py_compile \
            src/config.py \
            src/credentials.py \
            src/dataset_generation.py \
            src/model_providers/base.py \
            src/model_providers/__init__.py \
            src/model_providers_manager.py

      - name: Run generation contracts
        env:
          PYTHONPATH: src
        run: python -m pytest tests/test_generation_contract.py -q
