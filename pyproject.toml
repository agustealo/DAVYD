[build-system]
requires = ["setuptools>=80", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "davyd-dataset-studio"
version = "0.2.0"
description = "DAVYD AI Dataset Studio"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "DAVYD contributors" }]
dependencies = [
  "PySide6==6.11.2",
  "pandas==3.0.6",
  "pyarrow==25.0.1",
  "openpyxl>=3.1,<4",
  "numpy>=2.2,<3",
  "psutil>=7.1.3,<8",
  "matplotlib>=3.10,<4",
  "httpx>=0.28,<1",
  "requests>=2.32,<3",
  "tenacity>=9,<10",
  "keyring>=25,<26",
  "openai>=3.16.2,<4",
  "anthropic>=1.7,<2",
  "ollama>=0.6.2,<0.7",
  "google-genai>=2.24,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-qt>=4.5,<5",
  "ruff>=0.13,<1",
  "mypy>=1.18,<2",
  "pip-audit>=2.9,<3",
]

[project.scripts]
davyd = "ui_desktop:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "config",
  "credentials",
  "dataset_generation",
  "model_providers_manager",
  "settings",
  "ui_desktop",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["model_providers*", "ui*", "utils*", "autogen_client*"]
namespaces = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
